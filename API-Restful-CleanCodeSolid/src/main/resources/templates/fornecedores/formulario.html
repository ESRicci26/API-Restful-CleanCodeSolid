<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

<title>Cadastro de Fornecedor</title>

<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">


<div class="card shadow">

    <div class="card-header">

        <h3>Cadastro de Fornecedor</h3>

    </div>

    <div class="card-body">

        <form
                th:action="@{/fornecedores/salvar}"
                th:object="${fornecedor}"
                method="post">

            <input
                    type="hidden"
                    th:field="*{id}" />

            <div class="mb-3">

                <label class="form-label">
                    Razão Social
                </label>

                <input
                        class="form-control"
                        th:field="*{razaoSocial}"
                        required />

            </div>

            <div class="mb-3">

                <label class="form-label">
                    CNPJ
                </label>

                <input
                        class="form-control"
                        th:field="*{cnpj}"
                        required />

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Endereço
                </label>

                <input
                        class="form-control"
                        th:field="*{endereco}" />

            </div>

            <div class="row">

                <div class="col-md-4">

                    <label class="form-label">
                        Bairro
                    </label>

                    <input
                            class="form-control"
                            th:field="*{bairro}" />

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Município
                    </label>

                    <input
                            class="form-control"
                            th:field="*{municipio}" />

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        CEP
                    </label>

                    <input
                            class="form-control"
                            th:field="*{cep}" />

                </div>

            </div>

            <hr>

            <button
                    type="submit"
                    class="btn btn-success">

                Salvar

            </button>

            <a
                    th:href="@{/fornecedores}"
                    class="btn btn-secondary">

                Voltar

            </a>

        </form>

    </div>

</div>


</div>

</body>
</html>

<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Fornecedores</title>

<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">


<div class="d-flex justify-content-between mb-3">

    <h2>Lista de Fornecedores</h2>

    <div>

        <a
                th:href="@{/fornecedores/novo}"
                class="btn btn-primary">

            Novo Fornecedor

        </a>

        <a
                th:href="@{/api/fornecedores/relatorio}"
                target="_blank"
                class="btn btn-danger">

            PDF

        </a>

    </div>

</div>

<table
        class="table table-striped table-hover">

    <thead>

    <tr>

        <th>ID</th>
        <th>Razão Social</th>
        <th>CNPJ</th>
        <th>Município</th>
        <th>Ações</th>

    </tr>

    </thead>

    <tbody>

    <tr
            th:each="fornecedor : ${fornecedores}">

        <td th:text="${fornecedor.id}"></td>

        <td th:text="${fornecedor.razaoSocial}"></td>

        <td th:text="${fornecedor.cnpj}"></td>

        <td th:text="${fornecedor.municipio}"></td>

        <td>

            <a
                    th:href="@{'/fornecedores/editar/' + ${fornecedor.id}}"
                    class="btn btn-warning btn-sm">

                Editar

            </a>

            <a
                    th:href="@{'/fornecedores/deletar/' + ${fornecedor.id}}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Deseja realmente excluir este registro?')">

                Excluir

            </a>

        </td>

    </tr>

    </tbody>

</table>

</div>

</body>

</html>
